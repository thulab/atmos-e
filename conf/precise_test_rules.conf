# rule_id regex tests reason
#
# tests accepts comma-separated commit_history status columns.
# Special values:
#   ALL  - run every known task column
#   NONE - run no task for this matching file
#
# Matching is cumulative. If a changed file matches no rule, Atmos keeps the
# full test set as a safety fallback.

docs_docs ^docs/ NONE docs_only
docs_site ^site/ NONE docs_only
docs_license ^licenses/ NONE docs_only
docs_markdown (^|/)(README|NOTICE|LICENSE)(\..*)?$ NONE docs_only
peripheral_examples ^example/ NONE peripheral_only
peripheral_docker ^docker/ NONE peripheral_only
peripheral_connectors ^(flink|spark|hadoop|hive|grafana|zeppelin)- NONE connector_only
peripheral_tools ^(tools|compile-tools|testcontainer|code-coverage)/ NONE peripheral_only
peripheral_external ^(external-api|external-pipe-api|openapi|rewrite-tsfile-tool|site)/ NONE peripheral_only

build_root (^|/)pom\.xml$ ALL build_or_dependency
build_distribution ^distribution/ ALL distribution_change
build_assembly (^|/)src/assembly/ ALL distribution_change

config_files (^|/)(iotdb-system\.properties|iotdb-common\.properties|datanode-env|confignode-env|cluster-env|logback) config_insert,routine_test,se_insert,se_query config_change
config_module ^iotdb-core/(node-commons|confignode|datanode)/src/main/resources/ config_insert,routine_test,se_insert,se_query config_change

query_engine queryengine se_query,unse_query,weeklytest_query,treeview_query,sql_coverage,routine_test query_engine
query_sql (^|/)(sql|parser|planner|operator|execution|aggregation|expression|udf)(/|$) se_query,unse_query,weeklytest_query,treeview_query,sql_coverage,routine_test query_logic
query_relational (relational|table|information_schema) se_query,unse_query,weeklytest_query,treeview_query,sql_coverage,se_insert,unse_insert,weeklytest_insert table_model

write_storage (^|/)(storageengine|memtable|wal|flush|load|insert|write|schemaengine|metadata|tsfile|resource)(/|$) se_insert,unse_insert,weeklytest_insert,ts_performance,routine_test storage_write
compaction compaction compaction,se_insert,unse_insert,ts_performance,routine_test compaction
delete_delete (delete|deletion|modification|mods) delete_test,se_query,unse_query,routine_test,compaction delete_path

pipe_pipe (^|/)(pipe|sync)(/|$) pipe_test,pipe_test_win pipe
cluster_consensus (^|/)(consensus|confignode|cluster|procedure|partition|region|heartbeat)(/|$) cluster_insert,cluster_insert_2,cluster_insert_dt,longrun_test,routine_test,se_insert,se_query cluster_or_consensus
api_client (session|jdbc|client|rpc|thrift|protocol) api_insert,api_insert_cts,native_api_test,routine_test client_api
security_auth (auth|authorizer|permission|privilege|login|password|user|role) sql_coverage,routine_test,se_query security

tests_it ^integration-test/ sql_coverage,routine_test integration_test
tests_unit (^|/)src/test/ sql_coverage,routine_test test_code
